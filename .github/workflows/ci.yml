# Every test reports through annotations (tests/ci-run.sh): a failure as an
# error with its FAIL lines, and the whole run as one notice at the end.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # ooRexx's trunk, built from SVN at this revision (.github/actions/oorexx).
  OOREXX_REV: "13572"

jobs:
  linux:
    name: Ubuntu 24.04, every test, ${{ matrix.mpm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mpm: [event, prefork]
    env:
      ORX_CI_SUMMARY: /tmp/orx-ci-summary
    steps:
      - uses: actions/checkout@v5

      - name: ooRexx
        uses: ./.github/actions/oorexx
        with:
          revision: ${{ env.OOREXX_REV }}

      - name: Install Apache and RexxHTTP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apache2 apache2-dev
          sudo a2enmod cgid actions
          rexx -v
          curl -sSfL -o "$RUNNER_TEMP/rexxhttp.zip" https://rexx.epbcn.com/rexxhttp/rexxhttp-latest.zip
          mkdir -p "$RUNNER_TEMP/rexxhttp"
          unzip -q "$RUNNER_TEMP/rexxhttp.zip" -d "$RUNNER_TEMP/rexxhttp"
          echo "::notice title=Linux setup::$(rexx -v | head -1); $(apache2 -v | head -1); $(nproc) CPUs"
          # How long an interpreter takes to start here, as root and as Apache's user.
          t() { s=$(date +%s%N); "$@" > /dev/null 2>&1; echo $(( ($(date +%s%N) - s) / 1000000 ))ms; }
          echo 'say 1' > /tmp/one.rex; chmod 644 /tmp/one.rex
          echo "::notice title=rexx start-up::root: $(t rexx /tmp/one.rex) $(t rexx /tmp/one.rex) $(t rexx /tmp/one.rex); www-data: $(t sudo -u www-data rexx /tmp/one.rex) $(t sudo -u www-data rexx /tmp/one.rex) $(t sudo -u www-data rexx /tmp/one.rex); rxapi: $(ps -eo pid,user,args | grep '[r]xapi' | tr '\n' ';')"

      - name: Build and install
        run: |
          make
          sudo make install
          make modrexx
          sudo make install-modrexx

      - name: Apache with the ${{ matrix.mpm }} MPM
        run: |
          sudo apachectl -k stop || true; sleep 2
          sudo a2dismod -f mpm_event mpm_worker mpm_prefork > /dev/null 2>&1 || true
          sudo a2enmod mpm_${{ matrix.mpm }}
          sudo apachectl -k start; sleep 2
          echo "::notice title=MPM::$(apachectl -V | grep MPM)"

      - name: Every test
        run: sudo -E tests/ci-battery.sh ${{ matrix.mpm }} "$RUNNER_TEMP/rexxhttp"

      - name: Summary
        if: always()
        run: tests/ci-summary.sh "Linux ${{ matrix.mpm }}"

  macos:
    name: macOS, build and tests/standalone.sh
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ORX_CI_SUMMARY: /tmp/orx-ci-summary
    steps:
      - uses: actions/checkout@v5

      - name: Install Apache
        run: |
          brew install httpd
          echo "APXS=$(brew --prefix)/bin/apxs" >> "$GITHUB_ENV"

      - name: ooRexx
        id: oorexx
        uses: ./.github/actions/oorexx
        with:
          revision: ${{ env.OOREXX_REV }}

      - name: ooRexx on the PATH
        run: |
          O="${{ steps.oorexx.outputs.prefix }}"
          lib=$(find "$O/lib" \( -name 'librexx.dylib' -o -name 'librexx.*.dylib' \) 2>/dev/null | head -3 | tr '\n' ' ')
          echo "::notice title=ooRexx found::rexx: $O/bin/rexx%0Aheader: $O/include/oorexxapi.h%0Alibraries: $lib"
          [ -x "$O/bin/rexx" ] && [ -f "$O/include/oorexxapi.h" ] || { echo "::error title=ooRexx::rexx or oorexxapi.h not found"; exit 1; }
          echo "PATH=$O/bin:$PATH" >> "$GITHUB_ENV"
          echo "OOREXX_PREFIX=$O" >> "$GITHUB_ENV"

      - name: Build
        run: |
          if ! make APXS="$APXS" OOREXX_PREFIX="$OOREXX_PREFIX" > build.log 2>&1; then
              cat build.log
              echo "::error title=make failed::$(grep -E 'error|Error|undefined' build.log | head -30 | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')"
              exit 1
          fi
          cat build.log
          warnings=$(grep -c -E 'warning:' build.log || true)
          [ "$warnings" = 0 ] || echo "::warning title=Compiler warnings ($warnings)::$(grep -E 'warning:' build.log | head -20 | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')"

      - name: Install
        run: |
          mkdir -p "$HOME/bin"
          make install APXS="$APXS" OOREXX_PREFIX="$OOREXX_PREFIX" BINDIR="$HOME/bin" > install.log 2>&1 ||
              { cat install.log; echo "::error title=make install failed::$(tail -20 install.log | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')"; exit 1; }
          cat install.log
          echo "OOREXX_HOST=$HOME/bin/oorexx-host" >> "$GITHUB_ENV"

      - name: tests/standalone.sh
        run: |
          tests/ci-run.sh "macOS standalone event" tests/standalone.sh event
          tests/ci-run.sh "macOS standalone prefork" tests/standalone.sh prefork
          tests/ci-run.sh "macOS start-hold" tests/start-hold.sh

      - name: The mod_rexx layer builds (not required yet)
        continue-on-error: true
        run: |
          make modrexx APXS="$APXS" OOREXX_PREFIX="$OOREXX_PREFIX" > modrexx.log 2>&1 ||
              { cat modrexx.log; echo "::warning title=make modrexx failed::$(grep -E 'error|undefined' modrexx.log | head -20 | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')"; exit 1; }

      - name: Summary
        if: always()
        run: tests/ci-summary.sh "macOS"
