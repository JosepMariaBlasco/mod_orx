# A probe, not a test: what mod_orx would build on in Windows. The ooRexx
# installer's API (headers, import libraries), and whether several processes
# can take connections from one endpoint (AF_UNIX, named pipes).
# Each result is a notice; the job fails only if something does not build.

name: Windows probe

on:
  push:
    paths:
      - 'probes/windows/**'
      - '.github/workflows/windows-probe.yml'
  workflow_dispatch:

env:
  OOREXX_FILES: https://sourceforge.net/projects/oorexx/files/oorexx/5.3.0beta
  OOREXX_REV: "13358"

jobs:
  probe:
    name: Windows Server 2022, the probes
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: ooRexx, extracted from the installer
        shell: pwsh
        run: |
          $oo = "$env:RUNNER_TEMP\oorexx"
          curl.exe -sSfL -o "$env:RUNNER_TEMP\oorexx.exe" "$env:OOREXX_FILES/oorexx-5.3.0-$env:OOREXX_REV.windows.x86_64.exe/download"
          7z x -y "-o$oo" "$env:RUNNER_TEMP\oorexx.exe" | Out-Null
          $oo | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "OOREXX=$oo" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $v = (& "$oo\rexx.exe" -v | Select-Object -First 1)
          $os = (Get-CimInstance Win32_OperatingSystem)
          echo "::notice title=Windows setup::$v; $($os.Caption) build $($os.BuildNumber); $env:NUMBER_OF_PROCESSORS CPUs; api: $((Get-ChildItem "$oo\api" -Name) -join ', ')"
          # How long an interpreter takes to start: a whole rexx.exe, three times.
          'say 1' | Out-File -Encoding ascii "$env:RUNNER_TEMP\one.rex"
          $t = 1..3 | ForEach-Object { [int](Measure-Command { & "$oo\rexx.exe" "$env:RUNNER_TEMP\one.rex" | Out-Null }).TotalMilliseconds }
          echo "::notice title=rexx start-up::$($t -join ' ms, ') ms"

      - name: Apache (Apache Lounge's zip)
        shell: pwsh
        timeout-minutes: 5
        run: |
          # The zip's name changes with every release: take it from the download page.
          $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) mod_orx-ci'
          $page = (Invoke-WebRequest -UseBasicParsing -UserAgent $ua -TimeoutSec 60 https://www.apachelounge.com/download/).Content
          $m = [regex]::Match($page, 'href="([^"]*httpd-2\.4\.[0-9]+-[0-9]+-[Ww]in64-VS[0-9]+\.zip)"')
          if (-not $m.Success) { echo "::error title=Apache::no Win64 zip on the download page"; exit 1 }
          $url = [Uri]::new([Uri]'https://www.apachelounge.com/download/', $m.Groups[1].Value).AbsoluteUri
          Invoke-WebRequest -UseBasicParsing -UserAgent $ua -TimeoutSec 180 $url -OutFile "$env:RUNNER_TEMP\httpd.zip"
          Expand-Archive "$env:RUNNER_TEMP\httpd.zip" C:\Apache -Force
          $h = Get-ChildItem C:\Apache -Recurse -Filter httpd.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $h) { echo "::error title=Apache::httpd.exe not found in $url"; exit 1 }
          $ap = $h.Directory.Parent.FullName
          "APACHE=$ap" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $v = (& $h.FullName -v | Select-Object -First 1)
          $mpm = (& $h.FullName -V | Select-String 'Server MPM') -join ''
          echo "::notice title=Apache::$v; $mpm; $url; include: $(Test-Path $ap\include\httpd.h), lib: $((Get-ChildItem $ap\lib -Name) -join ', ')"

      - name: Build
        shell: cmd
        run: probes\windows\build.cmd "%OOREXX%" "%APACHE%"

      - name: The API
        shell: pwsh
        run: |
          $out = (& probes\windows\api.exe 2>&1) | Out-String
          $out
          $r = ($out -split "`n" | Where-Object { $_ -like 'RESULT*' }) -join ' '
          if (-not $r) { $r = "no RESULT (exit $LASTEXITCODE)" }
          echo "::notice title=API::$r"

      - name: The transports
        shell: pwsh
        run: |
          foreach ($m in 'afunix-inherit', 'afunix-dup', 'pipe', 'afunix-poll') {
            $p = Start-Process -FilePath probes\windows\transport.exe -ArgumentList $m, 3 -NoNewWindow -PassThru `
                   -RedirectStandardOutput "$env:RUNNER_TEMP\$m.txt"
            if (-not $p.WaitForExit(60000)) { $p.Kill($true); "(${m}: killed after 60 s)" | Out-File -Append "$env:RUNNER_TEMP\$m.txt" }
            $out = Get-Content "$env:RUNNER_TEMP\$m.txt" -Raw
            $out
            $r = ($out -split "`n" | Where-Object { $_ -like 'RESULT*' }) -join ' '
            if (-not $r) { $r = "${m}: no RESULT" }
            $d = ($out -split "`n" | Where-Object { $_ -notlike 'RESULT*' -and $_.Trim() }) -join '%0A'
            echo "::notice title=$m::$r%0A$d"
          }

      - name: Who may connect to an AF_UNIX socket
        shell: pwsh
        timeout-minutes: 5
        run: |
          $pub = 'C:\Users\Public\orxprobe'
          New-Item -ItemType Directory -Force $pub | Out-Null
          Copy-Item probes\windows\transport.exe $pub
          $pw = 'Orx-Probe-' + [guid]::NewGuid().ToString('N').Substring(0, 12) + '!'
          $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          try { New-LocalUser -Name orxprobe -Password $sec -PasswordNeverExpires -ErrorAction Stop | Out-Null }
          catch { echo "New-LocalUser: $($_.Exception.Message)" }
          Add-LocalGroupMember -Group Users -Member orxprobe -ErrorAction SilentlyContinue
          echo "the other user: $((Get-LocalUser orxprobe -ErrorAction SilentlyContinue | Select-Object Name, Enabled) -join ' ')"
          Start-Service seclogon -ErrorAction SilentlyContinue
          echo "seclogon: $((Get-Service seclogon).Status)"
          $cred = New-Object PSCredential("$env:COMPUTERNAME\orxprobe", $sec)
          function connectAs($who, $path) {
            $o = "$pub\out-$([guid]::NewGuid().ToString('N')).txt"
            try {
              if ($who -eq 'other') {
                Start-Process "$pub\transport.exe" -ArgumentList 'afunix-connect', $path -Credential $cred `
                  -WorkingDirectory $pub -RedirectStandardOutput $o -Wait -ErrorAction Stop
              } else {
                Start-Process "$pub\transport.exe" -ArgumentList 'afunix-connect', $path `
                  -NoNewWindow -RedirectStandardOutput $o -Wait -ErrorAction Stop
              }
              return (Get-Content $o -Raw).Trim()
            } catch { return "could not run as ${who}: $($_.Exception.Message)" }
          }
          function serve($path) {
            $p = Start-Process "$pub\transport.exe" -ArgumentList 'afunix-serve', $path -NoNewWindow -PassThru
            Start-Sleep 1
            return $p
          }
          $lines = @("runner user: $env:USERNAME")
          # A: a directory under C:\, with the ACL it inherits from C:\.
          New-Item -ItemType Directory -Force C:\orxA | Out-Null
          $p = serve 'C:\orxA\a.sock'
          $lines += "A, default ACL (C:\orxA): self: $(connectAs self 'C:\orxA\a.sock'); other: $(connectAs other 'C:\orxA\a.sock')"
          $lines += "   the socket's ACL: $((icacls C:\orxA\a.sock | Select-Object -First 6) -join ' | ')"
          # B: the same, then the socket's own ACL cut to the runner, SYSTEM and Administrators.
          icacls C:\orxA\a.sock /inheritance:r /grant:r "${env:USERNAME}:(F)" 'SYSTEM:(F)' 'Administrators:(F)' | Out-Null
          $lines += "B, the socket's ACL restricted: self: $(connectAs self 'C:\orxA\a.sock'); other: $(connectAs other 'C:\orxA\a.sock')"
          Stop-Process $p -Force
          # C: a directory with a restricted ACL; the socket is bound inside it.
          New-Item -ItemType Directory -Force C:\orxC | Out-Null
          icacls C:\orxC /inheritance:r /grant:r "${env:USERNAME}:(OI)(CI)(F)" 'SYSTEM:(OI)(CI)(F)' 'Administrators:(OI)(CI)(F)' | Out-Null
          $p = serve 'C:\orxC\c.sock'
          $lines += "C, restricted directory: self: $(connectAs self 'C:\orxC\c.sock'); other: $(connectAs other 'C:\orxC\c.sock')"
          Stop-Process $p -Force
          $lines | ForEach-Object { $_ }
          echo "::notice title=AF_UNIX permissions::$($lines -join '%0A')"

      - name: From inside Apache (mpm_winnt)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ap = $env:APACHE
          $root = $ap -replace '\\', '/'
          $mod = ((Resolve-Path probes\windows\mod_orxprobe.so).Path) -replace '\\', '/'
          @"
          ServerRoot "$root"
          ServerName localhost
          Listen 127.0.0.1:8094
          LoadModule authn_core_module modules/mod_authn_core.so
          LoadModule authz_core_module modules/mod_authz_core.so
          LoadModule orxprobe_module "$mod"
          ErrorLog logs/probe-error.log
          LogLevel notice
          PidFile logs/probe.pid
          DocumentRoot "$root/htdocs"
          <Location /probe>
              SetHandler orxprobe
              Require all granted
          </Location>
          "@ | Out-File -Encoding ascii "$ap\conf\probe.conf"
          Remove-Item "$ap\logs\probe-error.log" -ErrorAction SilentlyContinue
          $env:ORX_PROBE_HOST = (Resolve-Path probes\windows\transport.exe).Path
          $httpd = Start-Process "$ap\bin\httpd.exe" -ArgumentList '-f', "$ap\conf\probe.conf" -NoNewWindow -PassThru
          Start-Sleep 5
          $procs = Get-CimInstance Win32_Process | Where-Object { $_.Name -in 'httpd.exe', 'transport.exe' } |
                   ForEach-Object { "$($_.Name) $($_.ProcessId) (parent $($_.ParentProcessId))" }
          $r = 1..12 | ForEach-Object -Parallel { curl.exe -s -m 30 http://127.0.0.1:8094/probe } -ThrottleLimit 12
          $r | ForEach-Object { $_ }
          $served = @($r | Where-Object { $_ -like 'served by*' })
          $hosts = @($served | ForEach-Object { ($_ -split ' ')[2] } | Sort-Object -Unique)
          $log = Get-Content "$ap\logs\probe-error.log" | Where-Object { $_ -match 'orxprobe|error' } | Select-Object -Last 12
          $log | ForEach-Object { $_ }
          Get-Process httpd, transport -ErrorAction SilentlyContinue | Stop-Process -Force
          echo "::notice title=From inside Apache::$($served.Count)/12 served, by $($hosts.Count) host process(es): $($hosts -join ' ')%0Aprocesses: $($procs -join '; ')%0A$(($log | ForEach-Object { $_ -replace '^\[[^\]]*\] ', '' }) -join '%0A')"
